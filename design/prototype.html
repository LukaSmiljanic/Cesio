<title>Cesio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ledger-style app shell. Fixed sidebar + work area; summary first, history below; one teal accent, semantic colors for state only. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F3; --ink:#13202A; --ink-2:#4B5B68; --ink-3:#71818E;
  --line:#D6DEE4; --accent:#0E6E6A; --accent-ink:#FFFFFF; --accent-soft:#DCEEED;
  --pos:#1B7443; --pos-soft:#DFF1E6; --warn:#8F5A00; --warn-soft:#FBEED3; --crit:#AE2A20; --crit-soft:#FADFDC;
  --focus:#2B7FD9; --shadow:0 1px 2px rgba(19,32,42,.06),0 8px 24px rgba(19,32,42,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --surface:#141E26; --surface-2:#1B2731; --ink:#E4ECF1; --ink-2:#A2B2BE; --ink-3:#7F909C;
  --line:#293844; --accent:#3DB0A7; --accent-ink:#04201D; --accent-soft:#12312E;
  --pos:#5CC48A; --pos-soft:#143424; --warn:#E3AA3E; --warn-soft:#3A2B0F; --crit:#F07D73; --crit-soft:#3C1A18;
  --focus:#6AAEF5; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#141E26; --surface-2:#1B2731; --ink:#E4ECF1; --ink-2:#A2B2BE; --ink-3:#7F909C;
  --line:#293844; --accent:#3DB0A7; --accent-ink:#04201D; --accent-soft:#12312E;
  --pos:#5CC48A; --pos-soft:#143424; --warn:#E3AA3E; --warn-soft:#3A2B0F; --crit:#F07D73; --crit-soft:#3C1A18;
  --focus:#6AAEF5; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:6px 16px;background:var(--ink);color:var(--bg);font-size:12.5px}
.banner button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:2px 10px;color:inherit;cursor:pointer;font-size:12px}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 32px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:13px;font-family:var(--f-mono);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .count{font-size:11.5px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left;line-height:1.25}
.seg button small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.user{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:12px;border:1px solid var(--line)}

.content{padding:28px;display:flex;flex-direction:column;gap:24px;max-width:1240px;width:100%}
.crumbs{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{all:unset;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.15;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-body);font-weight:600;font-size:15px;margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-2)}

.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 20px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tr.best td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.tag-best{font-size:11px;font-weight:600;color:var(--accent);margin-left:6px;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.neutral{background:var(--surface-2);color:var(--ink-2)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.pos{background:var(--pos-soft);color:var(--pos)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sim{border-style:dashed;color:var(--ink-2);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.act-list{list-style:none;margin:0;padding:0}
.act-list li{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.act-list li:last-child{border-bottom:0}
.act-list .t{font-weight:500}
.act-list .d{font-size:12.5px;color:var(--ink-2)}
.empty{padding:22px 18px;color:var(--ink-2)}

.turn{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.turn.you{border-color:var(--warn);background:var(--warn-soft)}
.turn.done{border-color:var(--pos);background:var(--pos-soft)}
.turn b{font-weight:600}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);position:relative}
.steps li:last-child{border-bottom:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--ink-3);background:var(--surface);font-variant-numeric:tabular-nums}
.steps li.done .dot{background:var(--pos);border-color:var(--pos);color:var(--surface)}
.steps li.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps li.skip .dot{border-style:dashed}
.steps .st{font-weight:600}
.steps .who{font-size:12px;color:var(--ink-3);margin-left:8px;font-weight:500}
.steps .ex{font-size:13px;color:var(--ink-2);margin-top:2px;max-width:68ch}
.steps .meta{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.steps .acts{margin-top:10px}
.steps li.cur{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}

.hist{list-style:none;margin:0;padding:0;font-size:13px}
.hist li{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:8px 18px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}

.stamp{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--pos);color:var(--pos);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600}
.stamp .mono{font-weight:400;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:10px 12px}
.warnbox{font-size:13px;color:var(--ink);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:6px;padding:10px 12px}
.errbox{font-size:13px;color:var(--crit);background:var(--crit-soft);border-radius:6px;padding:8px 12px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;width:100%}
.input:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);outline-offset:0}
.input.money{font-variant-numeric:tabular-nums;text-align:right;font-size:16px;font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}

.metrics{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:13.5px;margin:0}
.metrics dt{color:var(--ink-2)}
.metrics dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.metrics .total{border-top:1px solid var(--line);padding-top:8px;font-weight:600;color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:7px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.checks li:last-child{border-bottom:0}
.checks .ok{color:var(--pos);font-weight:700;width:16px;flex:none}
.checks .run{color:var(--ink-3);width:16px;flex:none}

.overlay{position:fixed;inset:0;background:rgba(10,18,24,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;border:1px solid var(--line)}
.modal-h{padding:18px 22px 6px}
.modal-h h2{font-family:var(--f-display);font-size:20px;font-weight:700}
.modal-b{padding:10px 22px 4px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:16px 22px 20px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.otp{font-family:var(--f-mono);font-size:24px;letter-spacing:.4em;text-align:center}
.big{font-family:var(--f-display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}

.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13.5px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;padding:10px 16px;gap:14px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .side-foot{display:none}
  .brand span{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .content{padding:20px 16px}
  .top{padding:10px 16px}
  .hist li{grid-template-columns:minmax(0,1fr)}
  h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="banner" role="note">
  <span><b>Prototip v0.1</b> · svi podaci, firme i iznosi su izmišljeni · ništa se ne čuva i ne šalje</span>
  <button type="button" data-act="reset">Vrati početno stanje</button>
</div>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="brand-mark">C</div><span>Cesio</span></div>
    <nav class="nav" id="nav" aria-label="Glavna navigacija"></nav>
    <div class="side-foot">Naziv i brend su privremeni.<br>Danas: 05.10.2026.</div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="seg" role="group" aria-label="Uloga u prototipu" id="roles"></div>
      <div class="user"><span id="who"></span><div class="avatar" id="avatar"></div></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---------- utilities (money in para = integer minor units; no floats for amounts) ---------- */
const TODAY = new Date(2026, 9, 5, 9, 30);
const pad = n => String(n).padStart(2, '0');
const toDate = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const toDT = s => { const [a, b = '00:00'] = s.split('T'); const x = toDate(a); const [h, mi] = b.split(':').map(Number); x.setHours(h, mi); return x; };
const mid = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
const days = (a, b) => Math.round((mid(b) - mid(a)) / 864e5);
function addBD(date, n) { const x = mid(date); let k = 0; while (k < n) { x.setDate(x.getDate() + 1); const w = x.getDay(); if (w !== 0 && w !== 6) k++; } return x; }
const iso = x => `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
const fD = x => { x = typeof x === 'string' ? toDate(x) : x; return `${pad(x.getDate())}.${pad(x.getMonth() + 1)}.${x.getFullYear()}.`; };
const fDT = s => { const x = typeof s === 'string' ? toDT(s) : s; return `${fD(x)} ${pad(x.getHours())}:${pad(x.getMinutes())}`; };
function fM(p, cur = true) { const neg = p < 0; p = Math.abs(p); const w = Math.floor(p / 100), c = p % 100; return (neg ? '−' : '') + String(w).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + pad(c) + (cur ? ' RSD' : ''); }
const fShort = p => (p / 1e8).toFixed(1).replace('.', ',') + ' mil. RSD';
const fPct = x => (x * 100).toFixed(2).replace('.', ',') + ' %';
function parseM(s) {
  s = String(s).trim().replace(/\s|RSD/gi, ''); if (!s) return null;
  let ip, dp = '';
  if (s.includes(',')) { const parts = s.split(','); if (parts.length > 2) return null; ip = parts[0].replace(/\./g, ''); dp = parts[1]; }
  else { const m = s.match(/^(.*)\.(\d{1,2})$/); if (m) { ip = m[1].replace(/\./g, ''); dp = m[2]; } else ip = s.replace(/\./g, ''); }
  if (!/^\d{1,13}$/.test(ip) || !/^\d{0,2}$/.test(dp)) return null;
  return Number(ip) * 100 + Number((dp + '00').slice(0, 2));
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const feeOf = (F, P) => Math.round((F - P) * 15 / 100); // 15 % of the factor's discount (F − P) (ADR-007, BQ-01 decided 2026-10-22)
const recourseLbl = r => r === 'Recourse' ? 'Sa regresom' : 'Bez regresa';
let clock = new Date(TODAY);
const now = () => { clock = new Date(clock.getTime() + 7 * 60000); return `${iso(clock)}T${pad(clock.getHours())}:${pad(clock.getMinutes())}`; };

/* ---------- fictional data ---------- */
const SELLER = { name: 'Severna Ambalaža d.o.o.', pib: '109876543', mb: '21456789', user: 'Jelena Marković', ini: 'JM' };
const ME_F = { name: 'Faktor Alfa d.o.o.', pib: '110223344', user: 'Nikola Ilić', ini: 'NI' };
const FACTORS = ['Faktor Alfa d.o.o.', 'Beta Faktoring a.d.', 'Gamma Banka a.d.', 'Delta Finans d.o.o.'];

const STEPS = [
  { k: 'accepted', t: 'Ponuda prihvaćena', who: 'seller', ex: 'Ostale ponude su zatvorene, a potraživanje je rezervisano za ovaj posao.' },
  { k: 'cdd', t: 'CDD provera faktora', who: 'factor', ex: 'Faktor sprovodi sopstvenu proveru klijenta (KYC/AML) na osnovu KYB paketa koji ste odobrili za deljenje.' },
  { k: 'contract', t: 'Ugovor i potvrda uslova', who: 'both', ex: 'Faktor otprema svoj ugovor o faktoringu. Obe strane potvrđuju da strane, faktura, iznos, cena i regres odgovaraju prihvaćenoj ponudi.' },
  { k: 'signed', t: 'Potpisivanje (KEP)', who: 'both', ex: 'Ovlašćeni potpisnici potpisuju ugovor kvalifikovanim elektronskim potpisom. Platforma proverava potpise i ovlašćenja. Potpisivanjem je potraživanje ustupljeno.' },
  { k: 'cef', t: 'Centralna evidencija faktoringa', who: 'seller', ex: 'Evidencija iz čl. 32a Zakona o faktoringu još nije u funkciji. Kada počne sa radom, ovde se evidentira ustupanje.' },
  { k: 'notice', t: 'Obaveštenje dužnika', who: 'seller', ex: 'Dužnik se obaveštava o ustupanju na način predviđen ugovorom; dokaz se prilaže ovde.' },

function sefBlock(r) {

    <div id="decl-err"></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="submitRec" data-id="${r.id}">Pošalji na proveru</button></div></div></section>`;
  else if (r.state === 'Pending' || (r.state === 'Verified' && S.checks[r.id])) side = `<section class="panel"><div class="panel-h"><h2>Provera</h2>${r.state === 'Verified' ? chip(['Sve provere prošle', 'pos']) : chip(['U toku', 'neutral'])}</div><div class="panel-b"><ul class="checks">${(S.checks[r.id] || []).map(c => `<li><span class="${c.ok ? 'ok' : 'run'}" aria-hidden="true">${c.ok ? '✓' : '…'}</span><span>${esc(c.t)}</span></li>`).join('')}</ul>
    ${r.state === 'Verified' ? `<div class="row" style="margin-top:14px"><button class="btn primary" data-act="publishOpen" data-id="${r.id}">Objavi na tržištu</button></div>` : ''}</div></section>`;
  else if (r.state === 'Verified') side = `<section class="panel"><div class="panel-h"><h2>Spremno za tržište</h2></div><div class="panel-b stack"><div class="muted">Faktura je prošla sve provere. Objavite je da bi verifikovani faktori mogli da daju ponude.</div><div><button class="btn primary" data-act="publishOpen" data-id="${r.id}">Objavi na tržištu</button></div></div></section>`;
  else if (r.state === 'Listed') { const l = lst(r.listing); const n = offersOf(l.id).filter(o => o.state === 'Active').length;
    side = `<section class="panel"><div class="panel-h"><h2>Oglas</h2>${chip(['Otvoren', 'accent'])}</div><div class="panel-b stack"><dl class="dl"><div><dt>Zatvara se</dt><dd class="num">${fDT(l.closes)}</dd></div><div><dt>Publika</dt><dd>${esc(l.audience)}</dd></div><div><dt>Ponude</dt><dd>${n}</dd></div></dl><div class="row"><button class="btn primary" data-act="openOffers" data-id="${r.id}">Uporedi ponude</button><button class="btn" data-act="withdrawListing" data-id="${r.id}">Povuci oglas</button></div></div></section>`; }
  else if (r.deal) side = `<section class="panel"><div class="panel-h"><h2>Posao</h2></div><div class="panel-b stack"><div class="muted">Potraživanje je u poslu <span class="mono">${dealById(r.deal).ref}</span> sa ${esc(dealById(r.deal).factor)}.</div><div><button class="btn primary" data-act="openDeal" data-id="${r.deal}">Otvori posao</button></div></div></section>`;
  else if (r.state === 'Rejected') side = `<section class="panel"><div class="panel-h"><h2>Razlog odbijanja</h2></div><div class="panel-b"><div class="errbox">${esc(r.reason)}</div></div></section>`;
  return `${head}<div class="grid2">${info}${side}</div>`;

function vOffers() {
  const r = recById(S.p.id); const l = lst(r.listing);

  const best = offers[0];
  const rows = offers.map(o => `<tr class="${o === best ? 'best' : ''}"><td><b>${esc(o.factor)}</b>${o === best ? '<span class="tag-best">najviši neto iznos</span>' : ''}</td>
    <td class="r num">${fM(o.P)}</td><td class="r num">${fPct((r.F - o.P) / r.F)}</td><td class="r num"><b>${fM(o.P)}</b></td><td class="r num">${fPct(sellerCost(r.F, o.P, r.due, o.fd))}</td>
    <td>${o.rec === 'Recourse' ? chip(['Sa regresom', 'warn']) : chip(['Bez regresa', 'neutral'])}</td><td class="num">${o.fd} rd</td><td class="num">${fDT(o.valid)}</td>
    <td class="r"><button class="btn sm primary" data-act="accept" data-id="${o.id}">Prihvati…</button></td></tr>`).join('');
  return `${crumbs([['Potraživanja', 'recs'], [`Faktura ${r.inv}`, 'rec', r.id], ['Ponude']])}
  <div class="head"><div><div class="eyebrow">Oglas se zatvara ${fDT(l.closes)}</div><h1>Ponude za fakturu ${r.inv}</h1></div><div class="muted num">${esc(r.debtor)} · ${fM(r.F)} · dospeće ${fD(r.due)}</div></div>
  <section class="panel"><div class="tbl-wrap"><table><thead><tr><th>Faktor</th><th class="r">Kupoprodajna cena</th><th class="r">Diskont</th><th class="r">Vi dobijate</th><th class="r">Indikativni god. trošak</th><th>Regres</th><th>Isplata</th><th>Važi do</th><th></th></tr></thead>
  <tbody>${rows || `<tr><td colspan="9" class="empty">Još nema ponuda.</td></tr>`}</tbody></table></div></section>
  <div class="note"><b>Kako čitati:</b> „Vi dobijate” je iznos koji faktor uplaćuje na vaš račun; naknadu platforme plaća faktor. Indikativni godišnji trošak = diskont ÷ cena × 365 ÷ broj dana od očekivane isplate do dospeća. Služi samo za poređenje i nije savet. <b>Sa regresom</b> znači da, ako dužnik ne plati, faktor može tražiti iznos od vas.</div>`;
}

function marketRows() {
  let ls = visibleListings();

  const q = S.search.trim().toLowerCase(); if (q) ls = ls.filter(l => (l.debtor + ' ' + l.seller + ' ' + l.dpib).toLowerCase().includes(q));
  ls.sort((a, b) => toDT(a.closes) - toDT(b.closes));

function metricsHtml(l, P, fd) {
  if (P == null) return `<dl class="metrics"><dt>Diskont (vaša zarada)</dt><dd class="faint">unesite cenu</dd><dt>Naknada platforme (15 % diskonta)</dt><dd class="faint">—</dd><dt>Indikativni god. prinos (neto)</dt><dd class="faint">—</dd></dl>`;
  const D = l.F - P; const fee = feeOf(l.F, P);
  return `<dl class="metrics"><dt>Diskont (vaša zarada)</dt><dd>${fM(D)} · ${fPct(D / l.F)}</dd><dt>Naknada platforme (15 % diskonta)</dt><dd>${fM(fee)}</dd>
    <dt>Neto marža pri punoj naplati</dt><dd>${fM(D - fee)}</dd><dt>Dana od isplate do dospeća</dt><dd>${tenor(l.due, fd)}</dd>
    <dt class="total">Indikativni god. prinos (neto)</dt><dd class="total">${fPct(factorYield(l.F, P, l.due, fd))}</dd></dl>`;
}
function vMyOffers() {

  return `<div class="head"><div><div class="eyebrow">Faktor</div><h1>Moje ponude</h1></div></div>

/* ---------- modals ---------- */
function openModal(m) { S.modal = m; renderModal(); setTimeout(() => { const f = document.querySelector('#modal-root [data-autofocus]') || document.querySelector('#modal-root .modal button, #modal-root .modal input'); f && f.focus(); }, 0); }
function closeModal() { S.modal = null; renderModal(); }
function renderModal() {
  const root = document.getElementById('modal-root');
  if (!S.modal) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">${S.modal.html}</div></div>`;
}
function stepUp(what, onOk) {
  S.pending = onOk;
  openModal({ html: `<div class="modal-h"><div class="eyebrow">Dodatna potvrda identiteta</div><h2 id="m-title">${esc(what)}</h2></div>
    <div class="modal-b"><div class="muted">Unesite 6-cifreni kod iz aplikacije za autentifikaciju.</div>
    <input class="input otp" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Kod za potvrdu" data-autofocus>
    <div class="faint" style="font-size:12.5px">Prototip: unesite bilo kojih 6 cifara.</div><div id="otp-err"></div></div>
    <div class="modal-f"><button class="btn" data-act="close">Otkaži</button><button class="btn primary" data-act="stepOk">Potvrdi</button></div>` });
}
function sefImportHtml(results) {

    : `<div class="field"><label for="sef-ids">SEF ID-jevi faktura (jedan po redu ili odvojeni zarezom)</label><textarea class="input mono" id="sef-ids" rows="4">84512093, 84371652, 84498811</textarea></div>
       <div class="note">Uvoze se samo fakture u kojima ste izdavalac. Faktura se čuva kao nepromenljiv dokaz (UBL + SHA-256).</div>`}</div>
  <div class="modal-f">${results ? `<button class="btn primary" data-act="close" data-autofocus>Gotovo</button>` : `<button class="btn" data-act="close">Otkaži</button><button class="btn primary" data-act="sefRun">Uvezi</button>`}</div>`;
}
function publishHtml(r) {
  return `<div class="modal-h"><div class="eyebrow">Faktura <span class="mono">${r.inv}</span> · ${fM(r.F)}</div><h2 id="m-title">Objavi na tržištu</h2></div>
  <div class="modal-b">
    <fieldset style="border:0;padding:0;margin:0"><legend class="lbl">Ko vidi oglas</legend>
      <label class="check"><input type="radio" name="aud" value="all" checked><span>Svi verifikovani faktori</span></label>
      <label class="check"><input type="radio" name="aud" value="sel"><span>Samo izabrani faktori</span></label></fieldset>
    <fieldset style="border:0;padding:0;margin:0"><legend class="lbl">Isključi faktore</legend>
      ${FACTORS.map((f, i) => `<label class="check"><input type="checkbox" class="excl" value="${esc(f)}" id="ex${i}"><span>${esc(f)}</span></label>`).join('')}</fieldset>
    <div class="field"><label for="pub-close">Oglas se zatvara</label><select class="input" id="pub-close">${[3, 5, 7].map(n => `<option value="${n}" ${n === 5 ? 'selected' : ''}>za ${n} radnih dana · ${fD(addBD(TODAY, n))} u 15:00</option>`).join('')}</select></div>
    <div class="note">Pre objave ponovo proveravamo status fakture u SEF-u. Oglas možete povući dok ne prihvatite ponudu.</div></div>
  <div class="modal-f"><button class="btn" data-act="close">Otkaži</button><button class="btn primary" data-act="publishDo" data-id="${r.id}">Objavi oglas</button></div>`;
}
function acceptHtml(o) {
  const l = lst(o.listing); const r = recById(l.rec); const others = offersOf(l.id).filter(x => x.state === 'Active' && x.id !== o.id).length;
  return `<div class="modal-h"><div class="eyebrow">Faktura <span class="mono">${r.inv}</span> · ${esc(r.debtor)}</div><h2 id="m-title">Prihvati ponudu: ${esc(o.factor)}</h2></div>
  <div class="modal-b"><div><div class="lbl">Dobićete na račun ···· 4567-12</div><div class="big">${fM(o.P)}</div><div class="muted num">umesto ${fM(r.F)} na dan ${fD(r.due)} · diskont ${fM(r.F - o.P)}</div></div>
    <dl class="metrics"><dt>Regres</dt><dd>${recourseLbl(o.rec)}</dd><dt>Isplata</dt><dd>${o.fd} radn${o.fd === 1 ? 'i dan' : 'a dana'} nakon potpisivanja ugovora</dd><dt>Indikativni god. trošak</dt><dd>${fPct(sellerCost(r.F, o.P, r.due, o.fd))}</dd></dl>
    ${o.rec === 'Recourse' ? `<div class="warnbox">Ponuda je <b>sa regresom</b>: ako ${esc(r.debtor)} ne plati, faktor može tražiti iznos od vas.</div>` : ''}
    <div class="note">Šta se dešava: ${others ? `${others} ${others === 1 ? 'ostala ponuda se zatvara' : 'ostale ponude se zatvaraju'}, ` : ''}oglas se zatvara, a potraživanje se rezerviše za ovaj posao. Zatim faktor radi CDD proveru, sledi ugovor i potpisivanje kvalifikovanim elektronskim potpisom.</div>
    <label class="check"><input type="checkbox" id="ack"><span>Pročitao/la sam uslove i ovlašćen/a sam da prihvatim ponudu u ime ${esc(SELLER.name)}.</span></label><div id="ack-err"></div></div>
  <div class="modal-f"><button class="btn" data-act="close">Otkaži</button><button class="btn primary" data-act="acceptGo" data-id="${o.id}">Prihvati ponudu i kreiraj posao</button></div>`;
}
function fundingHtml(d) {
  return `<div class="modal-h"><div class="eyebrow">Posao <span class="mono">${d.ref}</span></div><h2 id="m-title">Prijavi isplatu</h2></div>
  <div class="modal-b"><div class="field"><span class="lbl">Iznos (mora biti jednak kupoprodajnoj ceni)</span><div class="big">${fM(d.P)}</div></div>
    <dl class="metrics"><dt>Primalac</dt><dd>${esc(d.seller)}</dd><dt>Račun primaoca</dt><dd class="mono">265-0000001234567-12 (primer)</dd><dt>Status računa</dt><dd>Verifikovan 12.09.2026.</dd></dl>
    <div class="form-grid"><div class="field"><label for="f-date">Datum valute</label><input class="input" id="f-date" value="${fD(TODAY)}"></div><div class="field"><label for="f-ref">Poziv na broj</label><input class="input mono" id="f-ref" value="97-2026-${d.ref.slice(-3)}"></div></div>
    <div class="note">Platforma ne vrši plaćanje. Uplatu izvršite iz svoje banke, a ovde je prijavite. Prodavac potvrđuje prijem.</div></div>
  <div class="modal-f"><button class="btn" data-act="close">Otkaži</button><button class="btn primary" data-act="fundingGo" data-id="${d.id}">Prijavi isplatu</button></div>`;
}

/* ---------- state changes ---------- */
function advance(d, text) {
  const s = STEPS[d.step]; const at = now();
  d.done[s.k] = at; d.hist.unshift({ at, t: text || `Završen korak: ${s.t}.` }); d.step++;
  if (STEPS[d.step] && STEPS[d.step].k === 'cef') { d.done.cef = at; d.hist.unshift({ at, t: 'CEF: nije primenjivo — evidencija nije u funkciji.' }); d.step++; }
  const r = recById(d.rec);
  if (d.step >= 9) r.state = 'Settled'; else if (d.step >= 8) r.state = 'Funded'; else if (d.step >= 4) r.state = 'Assigned';
}
function runChecks(r) {
  const t = days(TODAY, toDate(r.due));
  const list = ['SEF status: kupac prihvatio fakturu (provereno upravo)', 'Vi ste izdavalac fakture u SEF-u', 'Organizacija odobrena, bez zadržavanja', `Do dospeća ${t} dana (min. 15, maks. 180)`, 'Iznos u dozvoljenom opsegu', 'Dužnik: nema poklapanja na sankcionim listama', 'Nema duplikata (SEF ID, broj fakture, otisak fakture)', 'Izjave potpune (verzija DRAFT-0)'];
  S.checks[r.id] = list.map(x => ({ t: x, ok: false }));
  r.state = 'Pending'; r.sefAt = now(); render();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0;
  const tick = () => { S.checks[r.id][i].ok = true; i++; if (i === list.length) { r.state = 'Verified'; toast('Faktura je verifikovana i spremna za tržište.'); } if (S.view === 'rec' && S.p.id === r.id) render(); if (i < list.length) setTimeout(tick, reduce ? 0 : 280); };
  setTimeout(tick, reduce ? 0 : 280);
}

const A = {
  reset() { S = initial(); clock = new Date(TODAY); render(); toast('Prototip je vraćen na početno stanje.'); },
  role(e) { S.role = e.r; S.search = ''; go('dashboard'); },
  nav(e) { go(e.v, e.id ? { id: e.id } : {}); },
  openRec(e) { go('rec', { id: e.id }); },
  openOffers(e) { go('offers', { id: e.id }); },
  openDeal(e) { go('deal', { id: e.id }); },
  openListing(e) { go('listing', { id: e.id }); },
  close() { closeModal(); },
  overlay(e, ev) { if (ev.target.classList.contains('overlay')) closeModal(); },
  sefImport() { openModal({ html: sefImportHtml() }); },
  sefRun() {
    const ids = document.getElementById('sef-ids').value.split(/[\s,;]+/).filter(Boolean).slice(0, 50);
    const res = ids.map(id => {
      if (S.recs.some(r => r.sef === id)) return { id, ok: false, t: 'Već uvezeno' };
      if (id === '84498811') return { id, ok: false, t: 'Niste izdavalac ove fakture' };
      if (!/^\d{6,12}$/.test(id)) return { id: esc(id), ok: false, t: 'Neispravan SEF ID' };
      const n = S.rseq++; S.recs.unshift({ id: 'R' + n, inv: '2026-04' + (40 + n), sef: id, debtor: 'Dunav Logistika d.o.o.', dpib: '106554433', F: 512640000, issue: '2026-10-03', due: '2026-12-31', state: 'Draft', sefAt: now() });
      return { id, ok: true, t: 'Uvezeno kao nacrt · Dunav Logistika d.o.o. · 5.126.400,00 RSD' };
    });
    openModal({ html: sefImportHtml(res) }); if (['recs', 'dashboard'].includes(S.view)) { renderShell(); document.getElementById('view').innerHTML = S.view === 'recs' ? vRecs() : vDashboard(); }
  },
  submitRec(e) {
    const all = [...document.querySelectorAll('.decl')].every(c => c.checked);
    if (!all) { document.getElementById('decl-err').innerHTML = `<div class="errbox">Potvrdite sve izjave. Ako neka nije tačna, faktura ne može biti ponuđena faktorima.</div>`; return; }
    runChecks(recById(e.id));
  },
  publishOpen(e) { openModal({ html: publishHtml(recById(e.id)) }); },
  publishDo(e) {
    const r = recById(e.id); const n = Number(document.getElementById('pub-close').value);
    const excluded = [...document.querySelectorAll('.excl:checked')].map(c => c.value);
    const sel = document.querySelector('input[name="aud"]:checked').value === 'sel';
    const id = 'L' + (S.listings.length + 1);
    S.listings.push({ id, rec: r.id, seller: SELLER.name, state: 'Open', closes: `${iso(addBD(TODAY, n))}T15:00`, audience: sel ? 'Izabrani faktori' : (excluded.length ? `Svi verifikovani, osim ${excluded.length}` : 'Svi verifikovani faktori'), excluded });
    r.state = 'Listed'; r.listing = id; r.sefAt = now(); closeModal(); render(); toast('Oglas je objavljen. Verifikovani faktori ga sada vide.');
  },
  withdrawListing(e) { const r = recById(e.id); const l = lst(r.listing); l.state = 'Withdrawn'; offersOf(l.id).forEach(o => { if (o.state === 'Active') o.state = 'Superseded'; }); r.state = 'Verified'; delete r.listing; render(); toast('Oglas je povučen; aktivne ponude su zatvorene.'); },
  accept(e) { openModal({ html: acceptHtml(S.offers.find(o => o.id === e.id)) }); },
  acceptGo(e) {
    if (!document.getElementById('ack').checked) { document.getElementById('ack-err').innerHTML = `<div class="errbox">Potvrdite da ste pročitali uslove i da ste ovlašćeni.</div>`; return; }
    stepUp('Prihvatanje ponude', () => {
      const o = S.offers.find(x => x.id === e.id); const l = lst(o.listing); const r = recById(l.rec);
      if (o.state !== 'Active' || l.state !== 'Open') { toast('Ponuda više nije aktivna.'); return; }
      o.state = 'Accepted'; offersOf(l.id).forEach(x => { if (x.state === 'Active') x.state = 'Superseded'; }); l.state = 'Closed';
      const at = now(); const id = 'D' + S.seq; const ref = 'DL-2026-000' + S.seq++;
      S.deals.unshift({ id, ref, rec: r.id, seller: SELLER.name, factor: o.factor, F: r.F, P: o.P, recourse: o.rec, fd: o.fd, step: 1, created: at, done: { accepted: at }, hist: [{ at, t: `Prihvaćena ponuda ${o.factor} (${fM(o.P)}); ostale ponude zatvorene; posao kreiran.` }] });
      r.state = 'Reserved'; r.deal = id; go('deal', { id }); toast(`Posao ${ref} je kreiran. Faktor je obavešten.`);
    });
  },
  stepOk() {
    const v = document.getElementById('otp').value.trim();
    if (!/^\d{6}$/.test(v)) { document.getElementById('otp-err').innerHTML = `<div class="errbox">Kod mora imati tačno 6 cifara.</div>`; return; }
    const fn = S.pending; S.pending = null; closeModal(); fn && fn();
  },
  simulate(e) { const d = dealById(e.id); advance(d, `${STEPS[d.step].t}: završeno (simulacija u prototipu).`); render(); },
  dealCdd(e) { stepUp('Potvrda CDD provere', () => { advance(dealById(e.id), 'Faktor potvrdio da je CDD provera završena i odobrena.'); render(); toast('CDD potvrđen. Sledeći korak: ugovor.'); }); },
  dealDecline(e) { const d = dealById(e.id); const r = recById(d.rec); d.step = 0; d.hist.unshift({ at: now(), t: 'Faktor odbio posao nakon CDD provere. Posao otkazan.' }); S.deals = S.deals.filter(x => x !== d); r.state = 'Verified'; delete r.deal; delete r.listing; go('deals'); toast('Posao je otkazan; potraživanje je ponovo dostupno prodavcu.'); },
  fundingOpen(e) { openModal({ html: fundingHtml(dealById(e.id)) }); },
  fundingGo(e) { stepUp('Prijava isplate', () => { const d = dealById(e.id); advance(d, `${d.factor} prijavio isplatu ${fM(d.P)}, poziv na broj 97-2026-${d.ref.slice(-3)}.`); render(); toast('Isplata prijavljena. Prodavac potvrđuje prijem.'); }); },
  confirmFunds(e) { stepUp('Potvrda prijema sredstava', () => { const d = dealById(e.id); advance(d, `Prodavac potvrdio prijem ${fM(d.P)}. Naknada platforme obračunata faktoru.`); render(); toast('Prijem potvrđen. Posao je isplaćen.'); }); },
  discrepancy() { toast('U pravoj aplikaciji: otvara se spor „Odstupanje u isplati” i posao se zadržava.'); },
  outcome(e) { stepUp('Upis ishoda', () => { advance(dealById(e.id), 'Faktor evidentirao naplatu od dužnika. Posao zatvoren.'); render(); toast('Posao je zatvoren.'); }); },
  filter(e) { S.filters[e.f] = !S.filters[e.f]; render(); },
  submitOffer(e) {
    const l = lv(lst(e.id)); const P = parseM(document.getElementById('op-price').value); const err = document.getElementById('op-err');
    if (P == null) { err.innerHTML = `<div class="errbox">Unesite cenu u formatu 11.368.400,00.</div>`; return; }
    if (P <= 0 || P >= l.F) { err.innerHTML = `<div class="errbox">Cena mora biti veća od nule i manja od nominalnog iznosa (${fM(l.F)}).</div>`; return; }
    S.offers.push({ id: 'O' + S.oseq++, listing: l.id, factor: ME_F.name, P, rec: document.getElementById('op-rec').value, fd: Number(document.getElementById('op-days').value), valid: l.closes, state: 'Active', at: now() });
    render(); toast('Ponuda je poslata. Prodavac je obavešten.');
  },
  withdrawOffer(e) { const o = S.offers.find(x => x.id === e.id); o.state = 'Withdrawn'; render(); toast('Ponuda je povučena.'); },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, ev);
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'mk-search') { S.search = ev.target.value; document.getElementById('mk-body').innerHTML = marketRows(); }
  if (['op-price', 'op-days', 'op-rec'].includes(ev.target.id)) updateMetrics();
});
document.addEventListener('change', ev => { if (['op-days', 'op-rec'].includes(ev.target.id)) updateMetrics(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.modal) closeModal();
  if (ev.key === 'Enter' && ev.target.id === 'otp') A.stepOk();
  if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('tr.click')) ev.target.closest('tr.click').click();
});
function updateMetrics() {
  const l = lv(lst(S.p.id)); const P = parseM(document.getElementById('op-price').value);
  const fd = Number(document.getElementById('op-days').value);
  document.getElementById('op-metrics').innerHTML = metricsHtml(l, P != null && P > 0 && P < l.F ? P : null, fd);
}
render();
</script>
