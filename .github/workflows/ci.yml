name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: dotnet test
        run: |
          set -o pipefail
          dotnet test --no-build -c Release 2>&1 | tee test-output.txt
      - name: Report failed tests as annotations
        if: failure()
        run: bash scripts/annotate-test-failures.sh test-output.txt
      - name: Shared.Kernel branch coverage must be 100%
        run: |
          dotnet test --project tests/Shared.Kernel.Tests --no-build -c Release \
            --coverage --coverage-output-format cobertura --coverage-output kernel.cobertura.xml --results-directory TestResults
          bash scripts/check-kernel-coverage.sh TestResults/kernel.cobertura.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  no-float:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-no-float.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI image needs no licence (gitleaks-action does for organizations).
      - run: >
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag cesio:ci .
      - run: docker build --file web/Dockerfile --tag cesio-web:ci .
      - name: Smoke test the image with the Production settings (ADR-023)
        run: |
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=ci -days 1 -keyout certs/key.pem -out certs/cert.pem
          openssl pkcs12 -export -inkey certs/key.pem -in certs/cert.pem -out certs/dataprotection.pfx -passout pass:ci
          chmod 644 certs/dataprotection.pfx
          docker run -d --name api -p 8080:8080 -e ASPNETCORE_ENVIRONMENT=Production -e Auth__PublicBaseUrl=https://ci.invalid \
            -e DataProtection__CertificatePassword=ci -v "$PWD/certs/dataprotection.pfx:/run/secrets/dataprotection.pfx:ro" \
            -e ConnectionStrings__Cesio="Server=nowhere;Database=cesio;User Id=ci;Password=ci" cesio:ci api
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health/live && exit 0; sleep 1; done
          docker logs api
          exit 1
